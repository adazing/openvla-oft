type: patch_policy
dataset_class: factr_pickle.FactrPickleDataset
data_directory: "${env_vars.datasets.franka_pen}"
language_instruction: "pick up the pen"

# Robot constants
action_dim: 7              # eef_delta (6) + binary gripper (1)
num_actions_chunk: 8
proprio_dim: 0
normalization_type: "bounds_q99"
num_views: 2               # /realsense/front/im + /realsense/wrist/im

# Data slicing
window_size: 8
train_fraction: 0.95
subset_fraction: null

# Dataset-specific args
prefetch: false
image_topics: ["/realsense/front/im", "/realsense/wrist/im"]  # front = primary, wrist = secondary
